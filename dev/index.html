<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权力之路 · 一个美国小伙的从政之路</title>
<link rel="stylesheet" href="engine/style.css">
</head>
<body>
<div id="app"></div>

<!-- ==========================================================================
     引擎（稳定，一般不需要改动）
     ======================================================================= -->
<script src="engine/core.js"></script>
<!-- 本地化地基：P.t(key, 中文原文) 取串 + POTUS.define("l10n") 覆盖层按结构合并。
     中文无需字典（内联字面量即兜底），英文只写覆盖层，见 docs/I18N.md -->
<script src="engine/i18n.js"></script>
<!-- 统一的声明式条件求值器：事件门槛 / 结局规则 / 静好片段 / 主线 gate 共用这一套词汇 -->
<script src="engine/when.js"></script>
<script src="engine/dice.js"></script>
<script src="engine/effects.js"></script>
<!-- 三值性（机遇/风险/威胁）与动态经济标尺：内容写系数，抽中时按人物职级/能力折算 -->
<script src="engine/scale.js"></script>
<script src="engine/events.js"></script>
<!-- 时代风味词典 + 占位符替换：让可重复事件每次都换真实面孔（{ORG}/{PLACE}/{MEET}…），词典在 content/09-flavor.js -->
<script src="engine/flavor.js"></script>
<!-- 时间：年 → 月 → 档期（一个月一回合、时代压力、大/中/小事量级） -->
<script src="engine/time.js"></script>
<!-- 主线：这个人这一辈子主要在过哪一条命（单线制，可换线；只加权不硬塞） -->
<script src="engine/arc.js"></script>
<!-- 竞选：每一次民选晋升的一连串事件（单场制，一幕幕强制推进到投票日）——见 content/61-campaigns.js -->
<script src="engine/campaign.js"></script>
<!-- 静好岁月：没有事件的月份，主角的日子与"按部就班"的成长 -->
<script src="engine/vignette.js"></script>
<script src="engine/progression.js"></script>
<script src="engine/art.js"></script>
<!-- 界面层（view/）：由原 render.js 按职责分区拆分而来。都是往共享 window.POTUS 挂函数，
     彼此无求值期依赖；shell.js 定义 P.SCREEN 与 boot，约定最先加载。 -->
<script src="engine/view/shell.js"></script>
<script src="engine/view/title.js"></script>
<script src="engine/view/create.js"></script>
<script src="engine/view/topbar.js"></script>
<script src="engine/view/leftbar.js"></script>
<script src="engine/view/stage.js"></script>
<script src="engine/view/actions.js"></script>

<!-- ==========================================================================
     内容包清单 —— 新增内容只改这一块（加一行 <script src>）
     顺序无所谓；引擎通过注册表自动发现。
     ======================================================================= -->
<!-- 配置：平衡参数 / 派系 / 轨道 / 党派 / 姿态 -->
<script src="content/01-config.js"></script>
<!-- 事件类型（category）+ 量级（grade）：每个类型自带默认配图与配色 -->
<script src="content/05-categories.js"></script>
<!-- 时代媒介时间轴：报纸/广播/电视/互联网/短视频… 哪些年在，哪些年不在 -->
<script src="content/06-media.js"></script>
<!-- 人脉登记表：这一局里能反复出场的那些"人"（事件用 req.contact / effects.contact 引用） -->
<script src="content/07-contacts.js"></script>
<!-- 时代风味词典：可重复事件正文里的 {ORG}/{PLACE}/{MEET}/{PUB} 等占位符按当年填真实名词（配合 engine/flavor.js） -->
<script src="content/09-flavor.js"></script>
<!-- 静好岁月素材库：没有事件的月份里，主角的日子（时令/世相/案头/日常/心绪/收束） -->
<script src="content/08-vignettes.js"></script>
<!-- 事件配图的照片层：类型 → assets/events/<key>.jpg，缺图自动退回程序化 SVG -->
<script src="content/09-photo-art.js"></script>
<!-- 建角：出身 / 天赋 / 起点路径 -->
<script src="content/10-characters.js"></script>
<!-- 主线：已停用（玩法大改造——多支路主线砍掉）。保留文件便于回退，
     从加载清单移除后 P.reg.arc 为空，引擎不再推进任何主线。 -->
<!-- <script src="content/11-arcs.js"></script> -->
<!-- 出生州：当地选民的政治倾向（顺风/逆风/摇摆，影响起点派系与事件倾斜） -->
<script src="content/12-states.js"></script>
<!-- 年终随笔：把这一年写成三段人话（做了什么/得失/处境）的素材库 -->
<script src="content/13-year-tales.js"></script>
<!-- 职位名表：状态面板"职位卡"的 轨道×层级 → 真实职位名 -->
<script src="content/14-offices.js"></script>
<!-- 竞选链定义：每一次民选晋升的一连串事件（引擎 engine/campaign.js 读 reg.campaign）。
     各幕事件本体见 content/events/65-campaign-acts.js；末幕复用 60-progression.js 的 prog_*。 -->
<script src="content/61-campaigns.js"></script>
<!-- 时代锚点 + 黑天鹅（迁移期兼容层，未铺年代照旧走 era） -->
<script src="content/20-eras.js"></script>
<!-- 连续时间轴（去"时代"化）：按绝对年铺开的 worldline（pressure/brief/outlets）+ 全局定点事件表 fixed -->
<script src="content/21-worldline.js"></script>
<!-- 填充模板（事件池耗尽时兜底，保证永不枯竭） -->
<script src="content/30-fillers.js"></script>
<!-- 结局规则（声明式） -->
<script src="content/40-endings.js"></script>

<!-- 事件库：按时代/主题分文件。新增事件直接在此登记。
     建议命名：<序号>-<分类>.js，数字控制加载顺序。 -->
<script src="content/events/50-era-2008.js"></script>
<!-- 51-era-1960 / 52-era-1974 已作为 pre-1980 死内容清理（时钟 1980 起、其专属事件永不触发）。 -->
<!-- 时代浪潮：真实历史事件按主角层级分化（征兵/表决、游行/登记、帐篷/听证），
     低层级可「投入浪潮」换政治资本；大事件 critfail 可挂下野/硬结局 -->
<script src="content/events/54-era-waves.js"></script>
<!-- 媒介时间轴事件：同一件事，广播时代/电视时代/短视频时代各长出不同版本 -->
<script src="content/events/55-media-timeline.js"></script>
<script src="content/events/60-progression.js"></script>
<!-- 竞选各幕事件：61-campaigns.js 竞选链里投票日之前的那一幕一幕（引擎锁定、非随机抽） -->
<script src="content/events/65-campaign-acts.js"></script>
<!-- 路线抉择：参选 vs 幕僚、NGO vs 体制、州参议院 vs 联邦众议员、竞选团队 vs 州长。
     选项用 setTrack 改轨道，用 cross_* 标记给后续倾斜 -->
<script src="content/events/62-crossroads.js"></script>
<!-- 州联动事件：深州的逆风党、摇摆州的最后一周、深蓝州的温和派生存术 -->
<script src="content/events/64-states.js"></script>
<!-- 资源机制示范卡（丑闻/金钱/综合）：展示 cost（资源代价）与 stake（D&D 式投入加码）。 -->
<script src="content/events/70-demo-resources.js"></script>
<!-- 灰产线：不靠党内机器，靠"别人不敢说的事"往上走（把柄 / 人脉 / 单次生效） -->
<script src="content/events/80-shady.js"></script>
<!-- 媒体即武器：借笔 → 挡笔 → 用笔 → 拥有笔 -->
<script src="content/events/82-press.js"></script>
<!-- 事件链样板：一份档案的四幕（拿到 → 被反噬 → 摊牌 → 了结），靠 ev.after 跨月/跨年续接 -->
<script src="content/events/84-archive.js"></script>
<!-- 族群飞地与街头政治：讲台 / 商户公所 / 双语选票 / 巡逻队 / "你是我们的人" -->
<script src="content/events/86-enclave.js"></script>
<script src="content/events/90-career-2.js"></script>
<script src="content/events/91-scandal-2.js"></script>
<script src="content/events/93-media-2.js"></script>
<script src="content/events/94-foreign-2.js"></script>
<script src="content/events/95-political-2.js"></script>
<script src="content/events/96-crisis-2.js"></script>
<!-- 挫折包：落选/被掀翻/党内清洗/媒体围攻/健康/家庭 -->
<script src="content/events/97-setbacks.js"></script>
<!-- 金钱线：意外之财 / 税务审计 / 地产投资 / 领导型委员会 / 资金链断裂 -->
<script src="content/events/88-finance-2.js"></script>
<!-- 扩时代专属事件：1980 起的时代各自带中事件与小事（pre-1980 死时代已清理） -->
<script src="content/events/105-era-1980.js"></script>
<script src="content/events/106-era-1990.js"></script>
<script src="content/events/107-era-2001.js"></script>
<script src="content/events/108-era-2016.js"></script>
<!-- 新人机遇补给：为 9 个 boon 池为空的时代各补一张 tierMin:0 时代风味机遇卡 -->
<script src="content/events/109-boon-fill.js"></script>
<!-- 连续时间轴 · 1980—1990 定点大事件与事件串（去时代化，钉进全局 fixed；低层级落点 + 下行面） -->
<script src="content/events/110-line-1980s.js"></script>
<!-- 日常公务 / 选民服务池（chore 通道）：不进随机卡池，仅经 P.choresSlot 兜底注入；tierRaw 分四层级簇 -->
<script src="content/events/111-chores.js"></script>
<!-- 例：新增 2016 时代
     <script src="content/events/53-era-2016.js"></script>
     并在 content/20-eras.js 里补上该时代的 era 定义 -->
